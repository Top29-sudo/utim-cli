name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[full]"
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=utim_cli --cov-report=xml
        
    - name: Run import test
      run: |
        python -c "import utim_cli; from utim_cli import __version__; print(f'Version: {__version__}')"
        
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install linting tools
      run: pip install ruff flake8
      
    - name: Run ruff
      run: ruff check utim_cli/
      
    - name: Run flake8
      run: flake8 utim_cli/ --max-line-length=120 --ignore=E501,W503

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Build package
      run: |
        pip install build
        python -m build
        
    - name: Check package
      run: pip install twine && twine check dist/*