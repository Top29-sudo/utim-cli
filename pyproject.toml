[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utim-cli"
version = "2.2.1"
description = "UTIM – Universal Terminal Intelligence Manager. A powerful agentic AI coding assistant for your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Emend AI Proprietary EULA" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests==2.31.0",
    "aiohttp>=3.9.5",
    "python-dotenv==1.0.1",
    "urllib3==1.26.18",
    "charset-normalizer==3.3.2",
    "chardet==4.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "nest-asyncio>=1.5.0",
    "sqlalchemy>=2.0.0",
]

[project.urls]
Homepage = "https://utim.dev"
Documentation = "https://utim.dev/docs"
Changelog = "https://github.com/emendai/utim/blob/main/CHANGELOG.md"
Issues = "https://github.com/emendai/utim/issues"

[project.optional-dependencies]
# Optional features
search = [
    "scrapy>=2.11.0",
    "scrapy-playwright>=0.0.34",
    "beautifulsoup4>=4.12.0",
]
images = [
    "pillow>=9.0.0",
]
parsers = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]
mcp = [
    "mcp>=0.1.0",
]
full = [
    "scrapy>=2.11.0",
    "scrapy-playwright>=0.0.34",
    "beautifulsoup4>=4.12.0",
    "pillow>=9.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "mcp>=0.1.0; platform_system != 'Linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l' and platform_machine != 'armv8l' and platform_machine != 'arm' and platform_machine != 'armv7')",
    "openai>=1.30.0; platform_system != 'Linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l' and platform_machine != 'armv8l' and platform_machine != 'arm' and platform_machine != 'armv7')",
]
legacy-agent = [
    "openai>=1.30.0",
]
# Heavy / memory-heavy features — intentionally NOT in core dependencies.
# Installing these downloads several hundred MB (chromadb + sentence-transformers
# + the MiniLM model) and can lag low-spec PCs. The CLI works fully without them:
#   - Set UTIM_LITE_MODE=1 to force lightweight fallbacks (deterministic mock
#     embeddings, no local Qwen/torch download).
#   - Use `pip install "utim-cli[memory]"` on machines that can afford it.
memory = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.scripts]
utim = "utim_cli.utim:main_cli_entry"
utimlite = "utim_cli.utim:main_cli_entry"


[tool.setuptools.packages.find]
include = ["utim_cli*"]
exclude = ["tests*", "landing*", "scripts*"]

[tool.setuptools.package-data]
utim_cli = ["mcp_registry.json", "_version.py", "server/docs_md/*.md"]

[tool.pytest.ini_options]
markers = [
    "smoke: fast install validation tests (no live credentials required)",
    "slow: tests that make network calls or take more than 10 seconds",
    "integration: tests requiring live credentials or a running UTIM account",
    "benchmark: UTIM benchmark suite — tests all 9 agent benchmark families",
]
